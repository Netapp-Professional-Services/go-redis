name: RE Tests

on:
  push:
    branches: [master, v9, v9.7, v9.8]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.24.x]
        re-build: ["7.4.2-54"]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Clone Redis EE docker repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: RedisLabs/redis-ee-docker
          path: redis-ee

      - name: Set up ${{ matrix.go-version }}
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build cluster
        working-directory: redis-ee
        env:
          IMAGE: "redislabs/redis:${{ matrix.re-build }}"
          RE_USERNAME: test@test.com
          RE_PASS: 12345
          RE_CLUSTER_NAME: re-test
          RE_USE_OSS_CLUSTER: false
          RE_DB_PORT: 6379
        run: ./build.sh

      - name: Test
        env:
          RE_CLUSTER: true
          REDIS_VERSION: "7.4"
        run: |
          go test \
          --ginkgo.skip-file="ring_test.go" \
          --ginkgo.skip-file="sentinel_test.go" \
          --ginkgo.skip-file="osscluster_test.go" \
          --ginkgo.skip-file="pubsub_test.go" \
          --ginkgo.label-filter='!NonRedisEnterprise'
